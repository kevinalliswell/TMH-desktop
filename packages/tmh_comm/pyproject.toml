[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tmh-comm"
version = "0.1.0"
description = "TMH communication standards package for RS485(Modbus)/RS232 devices"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Proprietary" }
authors = [
  { name = "TMH Team" }
]
dependencies = [
  "pyserial>=3.5"
]

[project.urls]
Documentation = "README.md"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

