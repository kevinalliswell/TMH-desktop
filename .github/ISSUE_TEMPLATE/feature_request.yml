name: Feature Request
description: Propose a new feature or workflow improvement.
title: "[Feature] "
labels:
  - "type: feature"
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What user or operational problem are we solving?
      placeholder: Describe the current friction or missing capability.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed Solution
      description: Describe the preferred behavior or UI flow.
      placeholder: Describe the expected workflow and acceptance criteria.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Optional. Share rejected ideas or constraints.

