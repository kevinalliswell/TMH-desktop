name: Bug Report
description: Report a reproducible bug in TMH desktop.
title: "[Bug] "
labels:
  - "type: bug"
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened, and what did you expect to happen?
      placeholder: Describe the bug and the expected behavior.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps To Reproduce
      description: Include exact steps, sample data, or screenshots if available.
      placeholder: |
        1. Open ...
        2. Configure ...
        3. Click ...
        4. Observe ...
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include OS, Python version, app version, and device context.
      placeholder: |
        - OS:
        - Python:
        - TMH version:
        - Connected devices:
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs
      description: Paste key stack traces or attach screenshots/log snippets.

