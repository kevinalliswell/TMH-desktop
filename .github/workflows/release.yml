name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  validate-tag:
    name: validate-tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Export version metadata
        id: version
        run: |
          python scripts/app_version.py --github-output
          python scripts/app_version.py --validate --check-tag "${GITHUB_REF_NAME}"

  build-windows:
    name: build-windows
    runs-on: windows-latest
    needs: validate-tag
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            packages/tmh_comm/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt ./packages/tmh_comm

      - name: Build release package
        run: python build_release.py

      - name: Upload packaged artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: |
            release/*.zip
            release/*_info.json

  publish-release:
    name: publish-release
    runs-on: ubuntu-latest
    needs:
      - validate-tag
      - build-windows
    steps:
      - name: Download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: release-assets

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.validate-tag.outputs.tag }}
          generate_release_notes: true
          files: release-assets/**/*
