name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  validate-tag:
    name: validate-tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Export version metadata
        id: version
        run: |
          python scripts/app_version.py --github-output
          python scripts/release_manager.py verify --check-tag "${GITHUB_REF_NAME}"

  build-windows:
    name: build-windows
    runs-on: windows-latest
    needs: validate-tag
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            packages/tmh_comm/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt ./packages/tmh_comm

      - name: Build release package
        run: python build_release.py

      - name: Generate release notes from changelog
        run: python scripts/release_manager.py notes --version "${{ needs.validate-tag.outputs.version }}" --output release-notes.md

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.validate-tag.outputs.tag }}
          body_path: release-notes.md
          files: |
            release/*.zip
            release/*_info.json
