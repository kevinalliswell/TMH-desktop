name: CI

on:
  # 只覆盖长期存在的集成分支。话题分支由它自己的 PR 负责验证，不必再跑一遍
  # （同一提交同时命中 push 与 pull_request 会落进两个不同的 concurrency
  # group，等于每次推送双倍构建）。
  #
  # 集成分支必须留在这里：跨 PR 的语义合并缺陷——每个 PR 单看都正确，合到一起
  # 才出错——只有在合并后的集成分支上才暴露得出来。
  push:
    branches:
      - main
      - develop
      - "feature/**"
      - "release/**"
    tags-ignore:
      - "v*"
  # 不限定目标分支。此前限定为 [main, develop]，凡是以集成分支为目标的 PR
  # 一次 CI 都不会跑；用 "**" 而不是枚举分支前缀，是因为枚举必然随新前缀持续
  # 漏网，而漏网时没有任何报错——正是这一点让问题长期无人察觉。
  pull_request:
    branches:
      - "**"
  # 任意分支/提交的手动补跑入口。
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: ci (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is the production target; keep Ubuntu for fast feedback and
        # to catch platform-specific (encoding/path) regressions early.
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONPATH: .
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
      # Disable third-party pytest plugin autoload (e.g. pytest-qt) so the
      # headless smoke suite does not require a display server.
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            packages/tmh_comm/pyproject.toml

      - name: Install headless Qt system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt ./packages/tmh_comm

      - name: Validate application version metadata
        run: python scripts/release_manager.py verify

      - name: Compile Python sources
        run: python -m compileall src packages/tmh_comm/src scripts tests/ci

      - name: Run smoke tests
        run: pytest --junitxml=.pytest-results/junit.xml
