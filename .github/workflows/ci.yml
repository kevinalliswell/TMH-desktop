name: CI

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
      - "bugfix/**"
      - "hotfix/**"
      - "release/**"
    tags-ignore:
      - "v*"
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: ci (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is the production target; keep Ubuntu for fast feedback and
        # to catch platform-specific (encoding/path) regressions early.
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONPATH: .
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
      # Disable third-party pytest plugin autoload (e.g. pytest-qt) so the
      # headless smoke suite does not require a display server.
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            packages/tmh_comm/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt ./packages/tmh_comm

      - name: Validate application version metadata
        run: python scripts/release_manager.py verify

      - name: Compile Python sources
        run: python -m compileall src packages/tmh_comm/src scripts tests/ci

      - name: Run smoke tests
        run: pytest --junitxml=.pytest-results/junit.xml
